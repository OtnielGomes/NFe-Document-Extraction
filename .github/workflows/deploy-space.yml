name: deploy-space

on:
  workflow_run:
    workflows: ["checks"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.18"

      - name: Deploy only the tip of main
        id: tip
        run: |
          git fetch origin main
          tip="$(git rev-parse origin/main)"
          if [ "$tip" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skipping publish of ${{ github.event.workflow_run.head_sha }}; main is $tip"
          fi

      - name: Publish the Docker Space
        if: steps.tip.outputs.current == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
        run: >-
          uv run --locked --with "huggingface_hub>=1.1"
          python scripts/deploy_space.py
