[project]
name = "nfe-document-extraction"
version = "0.1.0"
description = "Turn a DANFE into structured data and state whether each field can be trusted."
requires-python = ">=3.12"
dependencies = [
    "brazilfiscalreport>=1.2.0",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "openai>=3.24.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pypdfium2>=5.13.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".agents", ".cursor"]

[tool.mypy]
python_version = "3.12"
