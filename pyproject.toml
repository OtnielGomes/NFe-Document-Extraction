[project]
name = "nfe-document-extraction"
version = "0.1.0"
description = "Turn a DANFE into structured data and state whether each field can be trusted."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
extend-exclude = [".agents", ".cursor"]

[tool.mypy]
python_version = "3.12"
